<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AERO_FLY // Chronex Systems</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #e7e9ef;
    --text: #3c4257;
    --text-soft: #939aad;
    --text-faint: #b3b9c8;
    --accent: #ef5b53;
    --accent-2: #ff7b70;
    --accent-deep: #dc463e;
    --ok: #4caf82;
    --warn: #e8a93a;
    --err: #ef5b53;
    --shadow-d: #c2c6d1;
    --shadow-l: #ffffff;
    --radius-l: 26px;
    --radius-m: 18px;
    --radius-s: 12px;
    --radius-pill: 100px;
    --font: 'Poppins', sans-serif;
  }
  body.light-mode {
    --bg: #2b2f3b;
    --text: #e9ecf5;
    --text-soft: #9299ac;
    --text-faint: #656c80;
    --shadow-d: #1f222b;
    --shadow-l: #383e4d;
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font);
    background-color: var(--bg);
    color: var(--text);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 2.5rem 1.25rem;
    overflow-x: hidden;
    transition: background-color 0.3s ease, color 0.3s ease;
  }

  #bgCanvas { display: none; }

  /* ===== Neumorphic primitives ===== */
  .neu-raised {
    background: var(--bg);
    box-shadow: 8px 8px 16px var(--shadow-d), -8px -8px 16px var(--shadow-l);
  }
  .neu-inset {
    background: var(--bg);
    box-shadow: inset 5px 5px 10px var(--shadow-d), inset -5px -5px 10px var(--shadow-l);
  }
  .neu-flat-sm {
    box-shadow: 4px 4px 8px var(--shadow-d), -4px -4px 8px var(--shadow-l);
  }

  /* ===== Header ===== */
  .app-header {
    width: 100%; max-width: 1080px;
    display: flex; justify-content: space-between; align-items: center;
    margin-bottom: 2rem;
  }
  .brand-row { display: flex; align-items: center; gap: 1rem; }
  .brand-mark {
    width: 52px; height: 52px; border-radius: 16px;
    display: flex; align-items: center; justify-content: center;
    color: var(--accent); flex-shrink: 0;
  }
  .brand-text h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.5px; }
  .brand-text p  { font-size: 0.72rem; color: var(--text-soft); font-weight: 500; margin-top: 2px; }

  .theme-toggle {
    background: var(--bg); color: var(--accent);
    border: none; border-radius: 50%;
    width: 48px; height: 48px; cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    box-shadow: 6px 6px 12px var(--shadow-d), -6px -6px 12px var(--shadow-l);
    transition: box-shadow 0.15s ease, transform 0.15s ease;
  }
  .theme-toggle:active {
    box-shadow: inset 4px 4px 8px var(--shadow-d), inset -4px -4px 8px var(--shadow-l);
  }
  .theme-toggle svg { width: 22px; height: 22px; }

  /* ===== Buttons ===== */
  button {
    cursor: pointer; font-family: var(--font); font-weight: 600;
    border: none; color: var(--text);
    background: var(--bg);
    border-radius: var(--radius-pill);
    box-shadow: 6px 6px 12px var(--shadow-d), -6px -6px 12px var(--shadow-l);
    transition: box-shadow 0.15s ease, transform 0.1s ease, color 0.15s ease;
    display: inline-flex; align-items: center; justify-content: center; gap: 0.5rem;
  }
  button:active:not(:disabled) {
    box-shadow: inset 4px 4px 8px var(--shadow-d), inset -4px -4px 8px var(--shadow-l);
  }
  button:disabled { color: var(--text-faint); cursor: not-allowed; opacity: 0.55; }

  button.primary {
    background: linear-gradient(145deg, var(--accent-2), var(--accent-deep));
    color: #fff;
    box-shadow: 6px 6px 14px rgba(220,70,62,0.35), -4px -4px 10px var(--shadow-l);
  }
  button.primary:active:not(:disabled) {
    box-shadow: inset 4px 4px 10px rgba(0,0,0,0.25), inset -2px -2px 6px rgba(255,255,255,0.15);
  }
  button.primary:disabled {
    background: var(--bg); color: var(--text-faint);
    box-shadow: 6px 6px 12px var(--shadow-d), -6px -6px 12px var(--shadow-l);
  }

  button.ghost {
    background: transparent; box-shadow: none; color: var(--text-soft);
    border: 2px dashed var(--text-faint);
  }
  button.ghost:hover:not(:disabled) { color: var(--accent); border-color: var(--accent); }
  button.ghost:active:not(:disabled) { box-shadow: none; }

  /* ===== Layout ===== */
  .dashboard {
    width: 100%; max-width: 1080px;
    display: grid; grid-template-columns: 380px 1fr; gap: 1.75rem;
  }
  @media (max-width: 880px) { .dashboard { grid-template-columns: 1fr; } }

  .panel {
    border-radius: var(--radius-l);
    padding: 1.75rem;
  }

  .panel-header {
    font-size: 0.78rem; font-weight: 700; letter-spacing: 0.5px; text-transform: uppercase;
    color: var(--text-soft);
    padding-bottom: 1.1rem; margin-bottom: 1.4rem;
    display: flex; justify-content: space-between; align-items: center;
  }
  .panel-header span.tag {
    font-size: 0.65rem; color: var(--accent); font-weight: 600;
  }

  /* NODE panel */
  .id-display {
    border-radius: var(--radius-m);
    padding: 1.5rem; text-align: center; margin-bottom: 1.3rem;
  }
  .id-display-label { font-size: 0.65rem; color: var(--text-soft); font-weight: 600; letter-spacing: 1px; margin-bottom: 0.7rem; text-transform: uppercase; }
  .id-value { font-size: 1.6rem; font-weight: 700; color: var(--accent); letter-spacing: 1px; }
  .copy-btn { font-size: 0.7rem; padding: 0.75rem 1rem; margin-top: 1.4rem; width: 100%; }

  .input-group label { display: block; font-size: 0.65rem; color: var(--text-soft); font-weight: 600; letter-spacing: 0.5px; margin-bottom: 0.7rem; text-transform: uppercase; }
  .input-action-wrapper { display: flex; flex-direction: column; gap: 0.9rem; margin-bottom: 1.2rem; }
  .input-action-wrapper input {
    background: var(--bg); color: var(--text);
    border: none; border-radius: var(--radius-m);
    box-shadow: inset 5px 5px 10px var(--shadow-d), inset -5px -5px 10px var(--shadow-l);
    font-family: var(--font); font-size: 1rem; font-weight: 600;
    text-align: center; padding: 0.95rem; outline: none; width: 100%;
    letter-spacing: 1px;
  }
  .input-action-wrapper input::placeholder { color: var(--text-faint); font-weight: 500; }
  .input-action-wrapper button { padding: 0.9rem; font-size: 0.78rem; }

  .status-indicator {
    display: flex; align-items: center; justify-content: space-between;
    padding: 0.9rem 1.2rem; border-radius: var(--radius-pill); font-size: 0.68rem; font-weight: 600;
    color: var(--text-soft);
  }
  .status-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--text-faint); flex-shrink: 0; box-shadow: inset 2px 2px 4px rgba(0,0,0,0.15); }

  @keyframes pulseDot { 0%,100% { opacity: 1; transform: scale(1); } 50% { opacity: 0.5; transform: scale(0.85); } }

  .status-indicator.connecting .status-dot { background: var(--warn); animation: pulseDot 0.8s infinite; }
  .status-indicator.connected  .status-dot { background: var(--ok); animation: pulseDot 1.4s infinite; }
  .status-indicator.error      .status-dot { background: var(--err); }
  .status-indicator.connected  { color: var(--ok); }
  .status-indicator.connecting { color: var(--warn); }
  .status-indicator.error      { color: var(--err); }

  .log-terminal {
    height: 120px; margin-top: 1.2rem; border-radius: var(--radius-m);
    padding: 1rem 1.1rem; font-size: 0.68rem; line-height: 1.9; overflow-y: auto;
    color: var(--text-soft); font-weight: 500;
  }
  .log .entry { display: block; }
  .log .entry.ok  { color: var(--ok); }
  .log .entry.err { color: var(--err); }
  .log .entry.info { color: var(--text-soft); }

  /* DROP ZONE */
  .drop-zone {
    border-radius: var(--radius-m);
    box-shadow: inset 5px 5px 10px var(--shadow-d), inset -5px -5px 10px var(--shadow-l);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; cursor: pointer;
    min-height: 170px; padding: 1.5rem; text-align: center;
    transition: box-shadow 0.15s ease;
  }
  .drop-zone.disabled { opacity: 0.4; pointer-events: none; }
  .drop-zone.hover    { box-shadow: inset 7px 7px 14px var(--shadow-d), inset -7px -7px 14px var(--shadow-l); }

  .dz-icon     { color: var(--accent); margin-bottom: 0.9rem; }
  .dz-icon svg { width: 44px; height: 44px; }
  .dz-title    { font-size: 0.95rem; font-weight: 700; margin-bottom: 0.5rem; }
  .dz-subtitle { font-size: 0.68rem; line-height: 1.7; color: var(--text-soft); font-weight: 500; }

  #fileInput   { position:absolute; inset:0; opacity:0; cursor:pointer; z-index:2; width:100%; }
  #folderInput { display:none; }

  /* VIRTUAL EXPLORER (NAS MODE) */
  .explorer-section { display: none; margin-bottom: 1.2rem; border-radius: var(--radius-m); padding: 1.2rem; }
  .explorer-header { font-size: 0.68rem; font-weight: 700; color: var(--accent); padding-bottom: 0.9rem; margin-bottom: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px; }
  .explorer-list { max-height: 250px; overflow-y: auto; }
  .exp-item {
    display: flex; justify-content: space-between; align-items: center; padding: 0.7rem 0.9rem;
    font-size: 0.68rem; font-weight: 500; cursor: pointer; border-radius: var(--radius-s); margin-bottom: 0.5rem;
    transition: box-shadow 0.15s ease;
  }
  .exp-item:hover { box-shadow: 3px 3px 6px var(--shadow-d), -3px -3px 6px var(--shadow-l); }
  .exp-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; padding-right: 1rem; }
  .exp-size { color: var(--text-soft); white-space: nowrap; font-size: 0.62rem; }

  /* FILE QUEUE */
  .queue-section { margin-top: 1.3rem; }
  .queue-header  {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.68rem; font-weight: 700; color: var(--text-soft);
    padding-bottom: 0.7rem; margin-bottom: 0.9rem; text-transform: uppercase; letter-spacing: 0.5px;
  }
  .queue-clear-btn { font-size: 0.6rem; padding: 0.5rem 0.9rem; }

  .queue-list { max-height: 220px; overflow-y: auto; border-radius: var(--radius-m); padding: 0.5rem; display: none; }
  .queue-item { display: grid; grid-template-columns: 1fr auto auto; align-items: center; gap: 0.6rem; padding: 0.8rem 0.9rem; font-size: 0.62rem; border-radius: var(--radius-s); margin-bottom: 0.4rem; }
  .queue-item:last-child { margin-bottom: 0; }
  .qi-name { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; line-height: 1.5; font-weight: 600; }
  .qi-path { font-size: 0.52rem; color: var(--text-faint); overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }
  .qi-size { font-size: 0.6rem; white-space: nowrap; color: var(--text-soft); }
  .qi-status { font-size: 0.55rem; font-weight: 700; white-space: nowrap; padding: 0.3rem 0.6rem; border-radius: var(--radius-pill); color: var(--text-soft); }
  .qi-status.sending { color: var(--warn); }
  .qi-status.DONE, .qi-status.done { color: var(--ok); }

  /* Global progress */
  .progress-container { border-radius: var(--radius-m); padding: 1.3rem; display: none; margin-top: 1.2rem; }
  .progress-header    { display: flex; justify-content: space-between; font-size: 0.62rem; font-weight: 600; color: var(--text-soft); margin-bottom: 0.9rem; gap: 0.5rem; }
  .progress-label-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }
  .progress-track     { height: 16px; border-radius: var(--radius-pill); box-shadow: inset 3px 3px 6px var(--shadow-d), inset -3px -3px 6px var(--shadow-l); padding: 3px; }
  .progress-fill { height: 100%; width: 0%; border-radius: var(--radius-pill); background: linear-gradient(90deg, var(--accent-2), var(--accent-deep)); transition: width 0.15s ease; }

  /* CONTROLS */
  .transfer-controls { margin-top: 1.3rem; display: flex; gap: 1rem; flex-wrap: wrap; align-items: center; }
  .folder-btn  { padding: 0 1.3rem; height: 50px; font-size: 0.68rem; }
  button.mount-btn { height: 50px; font-size: 0.68rem; padding: 0 1.3rem; }
  button.send-btn { flex: 100%; height: 54px; font-size: 0.85rem; letter-spacing: 0.5px; }

</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<header class="app-header">
  <div class="brand-row">
    <div class="brand-mark neu-raised">
      <svg width="26" height="26" viewBox="0 0 24 24" fill="none"><path d="M2 12L22 3L15 22L11 13L2 12Z" fill="currentColor"/></svg>
    </div>
    <div class="brand-text">
      <h1>AERO_FLY</h1>
      <p>Powered by Chronex Systems</p>
    </div>
  </div>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><span id="themeIcon"></span></button>
</header>

<main class="dashboard">

  <section class="panel neu-raised">
    <div class="panel-header">Node <span class="tag" id="nodeTag">● offline</span></div>

    <div class="id-display neu-inset">
      <div class="id-display-label">Your Host ID</div>
      <div class="id-value" id="myId">----</div>
      <button class="copy-btn" onclick="copyId()">
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="9" y="9" width="12" height="12" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>
        Copy ID
      </button>
    </div>

    <div class="input-group">
      <label>Target Peer ID</label>
      <div class="input-action-wrapper">
        <input type="text" id="peerId" placeholder="0000-0000" maxlength="9" oninput="formatInput(this)" />
        <button class="primary" id="connectBtn" onclick="connectToPeer()" disabled>
          Link Start
          <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
        </button>
      </div>
    </div>

    <div class="status-indicator idle neu-inset" id="statusBox">
      <span id="statusText">No Signal</span>
      <div class="status-dot"></div>
    </div>

    <div class="log-terminal log neu-inset" id="log"></div>
  </section>

  <section class="panel neu-raised">
    <div class="panel-header"><span>Payload</span> <span class="tag" id="nasStatus"></span></div>

    <div class="explorer-section neu-inset" id="explorerSection">
      <div class="explorer-header" id="expTitle">Mounted Volume</div>
      <div class="explorer-list" id="expList"></div>
    </div>

    <div class="drop-zone disabled" id="dropZone"
         ondragover="onDragOver(event)"
         ondragleave="onDragLeave(event)"
         ondrop="onDrop(event)">
      <input type="file" id="fileInput" multiple onchange="onFileSelected(event)" />
      <div class="dz-icon">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M7 18a4.6 4.4 0 0 1 0-9 5 4.5 0 0 1 11 2h1a3.5 3.5 0 0 1 0 7h-1"/><path d="M12 12v9"/><path d="M9 15l3-3 3 3"/></svg>
      </div>
      <div class="dz-title">Insert Payload</div>
      <div class="dz-subtitle">Drag files or a folder here<br>— or — click to browse</div>
    </div>

    <input type="file" id="folderInput" webkitdirectory multiple onchange="onFolderSelected(event)" />

    <div class="transfer-controls">
      <button class="folder-btn" id="folderBtn" onclick="document.getElementById('folderInput').click()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><path d="M3 7a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v8a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V7Z"/><path d="M12 11v4M10 13h4"/></svg>
        Folder
      </button>
      <button class="mount-btn ghost" id="mountBtn" onclick="mountRemoteDrive()" disabled>
        <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2"><rect x="4" y="7" width="16" height="12" rx="2"/><path d="M9 7V4h6v3"/></svg>
        Mount USB
      </button>
      <button class="send-btn primary" id="sendBtn" disabled onclick="startQueue()">
        Execute Transfer
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>

    <div class="queue-section" id="queueSection" style="display:none">
      <div class="queue-header">
        <span id="queueTitle">Queue: 0 files</span>
        <button class="queue-clear-btn" onclick="clearQueue()">Clear</button>
      </div>
      <div class="queue-list neu-inset" id="queueList"></div>
    </div>

    <div class="progress-container neu-inset" id="progressWrap">
      <div class="progress-header">
        <span class="progress-label-text" id="progressLabel">Loading...</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track neu-inset">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

  </section>
</main>

<script>
  /* ====== CANVAS (kept for JS compatibility, visually hidden) ====== */
  const canvas = document.getElementById('bgCanvas');
  const ctx    = canvas.getContext('2d');
  const PIXEL_SIZE = 32;
  let gridCols, gridRows, activePixels = [];

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    gridCols = Math.ceil(canvas.width  / PIXEL_SIZE);
    gridRows = Math.ceil(canvas.height / PIXEL_SIZE);
  }
  function initPixels() {
    activePixels = [];
    const count = Math.floor(gridCols * gridRows * 0.05);
    for (let i = 0; i < count; i++)
      activePixels.push({ x: Math.floor(Math.random()*gridCols), y: Math.floor(Math.random()*gridRows), life: Math.random()*50 });
  }
  function animateCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const isLight = document.body.classList.contains('light-mode');
    ctx.fillStyle = isLight ? '#000' : '#fff';
    for (let p of activePixels) {
      if (--p.life <= 0) {
        p.x = Math.floor(Math.random()*gridCols);
        p.y = Math.floor(Math.random()*gridRows);
        p.life = Math.random()*50+10;
      }
      ctx.fillRect(p.x*PIXEL_SIZE, p.y*PIXEL_SIZE, PIXEL_SIZE-2, PIXEL_SIZE-2);
    }
    setTimeout(() => requestAnimationFrame(animateCanvas), 1000/15);
  }
  window.addEventListener('resize', () => { resizeCanvas(); initPixels(); });
  resizeCanvas(); initPixels(); animateCanvas();

  /* ====== THEME ====== */
  const sunIcon  = '<svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round"><circle cx="12" cy="12" r="4.5"/><path d="M12 2v2.5M12 19.5V22M4.2 4.2l1.8 1.8M18 18l1.8 1.8M2 12h2.5M19.5 12H22M4.2 19.8L6 18M18 6l1.8-1.8"/></svg>';
  const moonIcon = '<svg width="20" height="20" viewBox="0 0 24 24" fill="currentColor"><path d="M20.6 15.3A8.5 8.5 0 1 1 8.7 3.4a7 7 0 0 0 11.9 11.9Z"/></svg>';

  function toggleTheme() {
    const isLight = document.body.classList.toggle('light-mode');
    document.getElementById('themeIcon').innerHTML = isLight ? moonIcon : sunIcon;
    localStorage.setItem('aero_theme', isLight ? 'light' : 'dark');
  }
  if (localStorage.getItem('aero_theme') === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('themeIcon').innerHTML = moonIcon;
  } else {
    document.getElementById('themeIcon').innerHTML = sunIcon;
  }

  /* ====== TRANSFER CORE WITH PERSISTENCE & AUTO-DOWNLOAD ====== */
  const CHUNK_SIZE         = 256 * 1024;
  const MAX_BUFFERED_AMOUNT = 2 * 1024 * 1024;

  let peer, conn;
  let fileQueue   = [];
  let queueIndex  = 0;   
  let isSending   = false;

  let incomingQueue   = [];   
  let rxMeta          = null;
  let rxChunks        = [];
  let rxBytes         = 0;
  let rxBatchTotal    = 0;
  let rxBatchReceived = 0;

  // NAS Host Memory
  let hostedFileHandles = new Map(); 

  function log(msg, type = '') {
    const el  = document.getElementById('log');
    const entry = document.createElement('span');
    entry.className = 'entry ' + type;
    const ts = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    entry.textContent = `[${ts}] ${msg}`;
    el.appendChild(entry);
    el.appendChild(document.createElement('br'));
    el.scrollTop = el.scrollHeight;
  }

  function setStatus(text, type) {
    const box = document.getElementById('statusBox');
    box.className = 'status-indicator neu-inset ' + type;
    document.getElementById('statusText').textContent = text;
    const tag = document.getElementById('nodeTag');
    if (tag) tag.textContent = type === 'connected' ? '● linked' : type === 'connecting' ? '● syncing' : type === 'error' ? '● error' : '● idle';
  }

  function generateId() { return Math.floor(1000 + Math.random()*9000) + '-' + Math.floor(1000 + Math.random()*9000); }
  function formatId(raw) { const d = raw.replace(/\D/g,'').slice(0,8); return d.length > 4 ? d.slice(0,4)+'-'+d.slice(4) : d; }
  function formatInput(el) { el.value = formatId(el.value); document.getElementById('connectBtn').disabled = el.value.replace('-','').length < 8; }
  function copyId() { navigator.clipboard.writeText(document.getElementById('myId').textContent).then(() => log('Room ID copied.', 'info')); }

  /* ====== PERSISTENT PEER INIT & AUTO-CONNECT ====== */
  function initPeer() {
    // Preserve local host ID across restarts
    let id = localStorage.getItem('aero_my_id');
    if (!id) {
      id = generateId();
      localStorage.setItem('aero_my_id', id);
    }

    document.getElementById('myId').textContent = id;
    peer = new Peer(id, { config: { iceServers: [{ urls: 'stun:stun.l.google.com:19302' }] }});
    
    peer.on('open', () => { 
      log('Ready. ID: ' + id, 'ok'); 
      document.getElementById('connectBtn').disabled = false;

      // Auto-connect if a previously paired target ID is remembered
      const savedPeerId = localStorage.getItem('aero_paired_peer_id');
      if (savedPeerId) {
        document.getElementById('peerId').value = savedPeerId;
        log(`Paired device found (${savedPeerId}). Auto-linking...`, 'info');
        connectToPeer(savedPeerId);
      }
    });

    peer.on('connection', c => { 
      conn = c; 
      setupConn(); 
      // Remember peer ID on incoming connection
      localStorage.setItem('aero_paired_peer_id', c.peer);
      log(`Auto-paired with peer ID: ${c.peer}`, 'ok'); 
    });

    peer.on('error', err => { 
      log('Error: ' + err.message, 'err'); 
      setStatus('Sys Halt', 'error'); 
    });
  }

  function connectToPeer(targetId) {
    const peerId = targetId || document.getElementById('peerId').value.replace(/\s/g,'');
    if (!peerId) return;
    
    setStatus('Syncing...', 'connecting');
    log('Connecting to ' + peerId + '…');
    
    // Save paired peer ID locally
    localStorage.setItem('aero_paired_peer_id', peerId);
    
    conn = peer.connect(peerId, { reliable: true });
    setupConn();
  }

  function setupConn() {
    conn.on('open', () => {
      setStatus('Link Active', 'connected');
      log('Link established ✓', 'ok');
      document.getElementById('dropZone').classList.remove('disabled');
      document.getElementById('folderBtn').disabled = false;
      document.getElementById('mountBtn').disabled = false;
    });

    conn.on('data', handleData);

    conn.on('close', () => {
      setStatus('No Signal', 'idle');
      log('Connection closed.', 'err');
      document.getElementById('dropZone').classList.add('disabled');
      document.getElementById('folderBtn').disabled = true;
      document.getElementById('mountBtn').disabled = true;
      document.getElementById('sendBtn').disabled = true;
      document.getElementById('explorerSection').style.display = 'none';
      document.getElementById('dropZone').style.display = 'flex';
      hostedFileHandles.clear();
    });
  }

  /* ====== RECEIVE SIDE & NAS COMMANDS (AUTO-ACCEPT ENABLED) ====== */
  function handleData(data) {
    if (data.type === 'batch_start') {
      rxBatchTotal = data.count; 
      rxBatchReceived = 0;
      log(`Incoming payload (${data.count} file(s), ${fmtSize(data.totalSize)}). Auto-accepting...`, 'info');
      // Automatically send acceptance protocol without interactive prompt
      conn.send({ type: 'accept' });

    } else if (data.type === 'meta') {
      incomingQueue.push(data);
      if (incomingQueue.length === 1) receiveNextFile();

    } else if (data.type === 'chunk') {
      rxChunks.push(data.chunk);
      rxBytes += data.chunk.byteLength;
      const pct = Math.round((rxBytes / rxMeta.size) * 100);
      showProgress(pct, `RX: ${rxMeta.name} ${pct}%`);

    } else if (data.type === 'file_done') {
      const blob = new Blob(rxChunks, { type: rxMeta.mime });
      downloadBlob(blob, rxMeta.name);
      log(`Received & saved: ${rxMeta.relativePath || rxMeta.name}`, 'ok');
      rxBatchReceived++;
      incomingQueue.shift();
      rxMeta = null; rxChunks = []; rxBytes = 0;
      if (incomingQueue.length > 0) receiveNextFile();
      else { hideProgress(); log('Download complete ✓', 'ok'); }

    } else if (data.type === 'accept') {
      log('Peer accepted.', 'info');
      sendNextInQueue();

    } else if (data.type === 'dir_map') {
      /* NAS: Receiving Virtual Directory Map */
      renderRemoteDrive(data.name, data.tree);

    } else if (data.type === 'req_file') {
      /* NAS: Host receiving request to stream a specific file */
      log(`Peer requested NAS fetch: ${data.path}`, 'info');
      streamHostedFile(data.path);
    }
  }

  /* ====== NAS HOST FUNCTIONS ====== */
  async function mountRemoteDrive() {
    if (!window.showDirectoryPicker) {
      alert("Your browser does not support the File System Access API. Please use a modern Chromium-based browser (Chrome/Edge).");
      return;
    }
    try {
      const dirHandle = await window.showDirectoryPicker();
      log(`Scanning volume: ${dirHandle.name}...`, 'info');
      hostedFileHandles.clear();
      const fileTree = [];
      
      await buildDirectoryMap(dirHandle, '', fileTree);
      
      log(`Mapped ${fileTree.length} objects. Broadcasting to peer...`, 'ok');
      document.getElementById('nasStatus').textContent = `Hosting: ${dirHandle.name}`;
      
      conn.send({ type: 'dir_map', name: dirHandle.name, tree: fileTree });
    } catch (e) {
      if(e.name !== 'AbortError') log('Mount Failed: ' + e.message, 'err');
    }
  }

  async function buildDirectoryMap(handle, currentPath, treeArray) {
    for await (const entry of handle.values()) {
      const itemPath = currentPath + entry.name;
      if (entry.kind === 'file') {
        const file = await entry.getFile();
        hostedFileHandles.set(itemPath, entry);
        treeArray.push({ name: entry.name, path: itemPath, size: file.size });
      } else if (entry.kind === 'directory') {
        await buildDirectoryMap(entry, itemPath + '/', treeArray);
      }
    }
  }

  async function streamHostedFile(path) {
    const handle = hostedFileHandles.get(path);
    if (!handle) return log('File vanished from volume.', 'err');
    
    const file = await handle.getFile();
    log(`Streaming NAS payload: ${file.name}...`, 'info');
    
    conn.send({
      type: 'meta', name: file.name, relativePath: path, size: file.size, mime: file.type
    });
    
    await sendChunks(file, `TX NAS: ${file.name}`);
    conn.send({ type: 'file_done' });
    log(`NAS Stream Complete: ${file.name}`, 'ok');
    hideProgress();
  }

  /* ====== NAS CLIENT FUNCTIONS ====== */
  function renderRemoteDrive(volumeName, tree) {
    document.getElementById('dropZone').style.display = 'none';
    const exp = document.getElementById('explorerSection');
    exp.style.display = 'block';
    document.getElementById('expTitle').textContent = `Volume: ${volumeName}`;
    
    const list = document.getElementById('expList');
    list.innerHTML = '';
    
    tree.sort((a,b) => a.path.localeCompare(b.path));

    tree.forEach(item => {
      const row = document.createElement('div');
      row.className = 'exp-item';
      row.innerHTML = `<span class="exp-name">${item.path}</span><span class="exp-size">${fmtSize(item.size)}</span>`;
      
      row.onclick = () => {
        log(`Requesting ${item.name} from host...`, 'info');
        conn.send({ type: 'req_file', path: item.path });
        showProgress(0, `AWAITING NAS STREAM: ${item.name}`);
      };
      list.appendChild(row);
    });
    log(`Remote Volume Mounted: ${volumeName}`, 'ok');
  }

  /* ====== STANDARD TRANSFER LOGIC ====== */
  function receiveNextFile() {
    rxMeta = incomingQueue[0]; rxChunks = []; rxBytes = 0;
    showProgress(0, `RX: ${rxMeta.name}`);
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  function addFilesToQueueRaw(files) {
    for (const file of files) {
      const relPath = file._relativePath || file.webkitRelativePath || file.name;
      fileQueue.push({ file, relativePath: relPath, status: 'pending', id: Date.now() + Math.random() });
    }
    renderQueue();
  }

  function onFileSelected(e) { addFilesToQueueRaw(Array.from(e.target.files)); e.target.value = ''; }
  function onFolderSelected(e) { addFilesToQueueRaw(Array.from(e.target.files)); e.target.value = ''; }

  function clearQueue() { if(isSending)return; fileQueue=[]; renderQueue(); document.getElementById('sendBtn').disabled = true; }
  
  function renderQueue() {
    const list = document.getElementById('queueList');
    if (fileQueue.length === 0) { list.style.display = 'none'; document.getElementById('queueSection').style.display = 'none'; return; }
    document.getElementById('queueSection').style.display = 'block'; list.style.display = 'block';
    document.getElementById('queueTitle').textContent = `Queue: ${fileQueue.length} file(s)`;
    list.innerHTML = '';
    fileQueue.forEach(q => {
      list.innerHTML += `<div class="queue-item" id="qi_${q.id}">
        <div><div class="qi-name">${q.file.name}</div><div class="qi-path">${q.relativePath}</div></div>
        <div class="qi-size">${fmtSize(q.file.size)}</div><div class="qi-status ${q.status}" id="qs_${q.id}">Wait</div>
      </div>`;
    });
    document.getElementById('sendBtn').disabled = false;
  }

  function startQueue() {
    if (!conn || fileQueue.length===0 || isSending) return;
    isSending=true; queueIndex=0; document.getElementById('sendBtn').disabled=true;
    conn.send({ type: 'batch_start', count: fileQueue.length, totalSize: fileQueue.reduce((a,q)=>a+q.file.size,0) });
    showProgress(0, 'AWAITING PEER SYNC...');
  }

  async function sendNextInQueue() {
    if (queueIndex >= fileQueue.length) { isSending = false; hideProgress(); return; }
    const item = fileQueue[queueIndex];
    document.getElementById('qs_'+item.id).className = 'qi-status sending';
    document.getElementById('qs_'+item.id).textContent = 'TX..';
    conn.send({ type: 'meta', name: item.file.name, relativePath: item.relativePath, size: item.file.size, mime: item.file.type });
    await sendChunks(item.file, `TX [${queueIndex+1}/${fileQueue.length}]: ${item.file.name}`);
    conn.send({ type: 'file_done' });
    document.getElementById('qs_'+item.id).className = 'qi-status done';
    document.getElementById('qs_'+item.id).textContent = 'Done';
    queueIndex++;
    sendNextInQueue();
  }

  async function sendChunks(file, label) {
    let offset = 0;
    const readChunk = off => new Promise(r => { const rd = new FileReader(); rd.onload = e => r(e.target.result); rd.readAsArrayBuffer(file.slice(off, off + CHUNK_SIZE)); });
    const wait = () => new Promise(r => { const c = () => { if(conn.dataChannel.bufferedAmount <= MAX_BUFFERED_AMOUNT) r(); else setTimeout(c,50); }; setTimeout(c,50); });
    
    while(offset < file.size) {
      await wait();
      const chunk = await readChunk(offset);
      conn.send({ type: 'chunk', chunk });
      offset += chunk.byteLength;
      showProgress(Math.round((offset/file.size)*100), `${label} ${Math.round((offset/file.size)*100)}%`);
    }
  }

  /* ====== UTILS ====== */
  function showProgress(pct, label) {
    document.getElementById('progressWrap').style.display = 'block';
    document.getElementById('progressLabel').textContent = label;
    document.getElementById('progressFill').style.width = pct + '%';
    document.getElementById('progressPct').textContent = pct + '%';
  }
  function hideProgress() { document.getElementById('progressFill').style.width = '100%'; document.getElementById('progressPct').textContent = '100%'; setTimeout(() => document.getElementById('progressWrap').style.display='none', 800); }
  function fmtSize(b) { return b<1024?b+' B':b<1024*1024?(b/1024).toFixed(1)+' KB':b<1024*1024*1024?(b/1024/1024).toFixed(1)+' MB':(b/1024/1024/1024).toFixed(2)+' GB'; }
  
  function onDragOver(e){e.preventDefault();document.getElementById('dropZone').classList.add('hover');}
  function onDragLeave(){document.getElementById('dropZone').classList.remove('hover');}
  async function onDrop(e){
    e.preventDefault(); document.getElementById('dropZone').classList.remove('hover');
    if(!e.dataTransfer.items) return;
    const files=[], promises=[];
    for(const item of e.dataTransfer.items) {
      if(item.kind!=='file') continue;
      const entry = item.webkitGetAsEntry?item.webkitGetAsEntry():null;
      if(entry&&entry.isDirectory) promises.push(readDirectory(entry,entry.name,files));
      else { const f=item.getAsFile(); if(f){f._relativePath=f.name; files.push(f);} }
    }
    await Promise.all(promises);
    if(files.length>0) addFilesToQueueRaw(files);
  }
  function readDirectory(dir, path, arr) {
    return new Promise(res => {
      const rd=dir.createReader(); let entries=[];
      const read=()=>{ rd.readEntries(async e=>{ if(e.length===0){ await Promise.all(entries.map(en=>{ if(en.isFile) return new Promise(r=>en.file(f=>{f._relativePath=path+'/'+f.name; arr.push(f); r();})); else if(en.isDirectory) return readDirectory(en,path+'/'+en.name,arr); })); res(); }else{ entries=entries.concat(Array.from(e)); read(); } }); };
      read();
    });
  }

  initPeer();
</script>
