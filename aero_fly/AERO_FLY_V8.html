<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AERO_TX // 8-BIT PROTOCOL</title>
<script src="https://unpkg.com/peerjs@1.5.4/dist/peerjs.min.js" crossorigin="anonymous"></script>
<link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --fg: #ffffff;
    --border-thickness: 4px;
    --font-pixel: 'Press Start 2P', monospace;
  }
  body.light-mode { --bg: #ffffff; --fg: #000000; }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  body {
    font-family: var(--font-pixel);
    background-color: var(--bg);
    color: var(--fg);
    min-height: 100vh;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    padding: 1rem;
    overflow-x: hidden;
    -webkit-font-smoothing: none;
  }

  #bgCanvas {
    position: fixed; top: 0; left: 0;
    width: 100vw; height: 100vh;
    z-index: -1; opacity: 0.1;
    pointer-events: none; image-rendering: pixelated;
  }

  .app-header {
    width: 100%; max-width: 1050px;
    display: flex; justify-content: space-between; align-items: flex-end;
    border-bottom: var(--border-thickness) solid var(--fg);
    padding-bottom: 1rem; margin-bottom: 1.5rem;
  }
  .brand-text h1 { font-size: 2rem; line-height: 1.2; text-transform: uppercase; margin-bottom: 0.5rem; }
  .brand-text p  { font-size: 0.6rem; letter-spacing: 2px; }

  .theme-toggle {
    background: var(--bg); color: var(--fg);
    border: var(--border-thickness) solid var(--fg);
    width: 48px; height: 48px; cursor: pointer;
    box-shadow: 4px 4px 0 var(--fg);
    transition: transform 0.1s, box-shadow 0.1s;
    font-family: var(--font-pixel); font-size: 1.2rem;
  }
  .theme-toggle:active { transform: translate(4px,4px); box-shadow: 0 0 0 var(--fg); }

  button {
    cursor: pointer; font-family: var(--font-pixel);
    background: var(--bg); color: var(--fg);
    border: var(--border-thickness) solid var(--fg);
    box-shadow: 6px 6px 0 var(--fg);
    transition: transform 0.1s, box-shadow 0.1s, background 0.1s, color 0.1s;
    text-transform: uppercase;
  }
  button:active  { transform: translate(6px,6px); box-shadow: 0 0 0 var(--fg); }
  button:hover   { background: var(--fg); color: var(--bg); }
  button:disabled { opacity: 0.3; cursor: not-allowed; box-shadow: 6px 6px 0 var(--fg); }
  button:disabled:hover { background: var(--bg); color: var(--fg); }

  .dashboard {
    width: 100%; max-width: 1050px;
    display: grid; grid-template-columns: 360px 1fr; gap: 1.5rem;
  }
  @media (max-width: 880px) { .dashboard { grid-template-columns: 1fr; } }

  .panel {
    background: var(--bg); border: var(--border-thickness) solid var(--fg);
    padding: 1.5rem; position: relative;
  }
  .panel::before, .panel::after {
    content: ''; position: absolute; width: 12px; height: 12px; background: var(--bg);
  }
  .panel::before { top:-4px; left:-4px; border-right: var(--border-thickness) solid var(--fg); border-bottom: var(--border-thickness) solid var(--fg); }
  .panel::after  { bottom:-4px; right:-4px; border-left: var(--border-thickness) solid var(--fg); border-top: var(--border-thickness) solid var(--fg); }

  .panel-header {
    font-size: 0.7rem; text-transform: uppercase;
    border-bottom: 2px dashed var(--fg); padding-bottom: 1rem; margin-bottom: 1.5rem;
  }

  /* NODE panel */
  .id-display {
    border: var(--border-thickness) solid var(--fg);
    padding: 1.5rem; text-align: center; margin-bottom: 1rem;
  }
  .id-display-label { font-size: 0.6rem; margin-bottom: 1rem; }
  .id-value { font-size: 1.5rem; }
  .copy-btn { font-size: 0.6rem; padding: 0.8rem; margin-top: 1.5rem; width: 100%; }

  .input-group label { display: block; font-size: 0.6rem; margin-bottom: 0.8rem; }
  .input-action-wrapper { display: flex; flex-direction: column; gap: 1rem; margin-bottom: 1rem; }
  .input-action-wrapper input {
    background: var(--bg); color: var(--fg);
    border: var(--border-thickness) solid var(--fg);
    font-family: var(--font-pixel); font-size: 1rem;
    text-align: center; padding: 1rem; outline: none; width: 100%;
  }
  .input-action-wrapper input:focus { background: var(--fg); color: var(--bg); }
  .input-action-wrapper input::placeholder { color: var(--fg); opacity: 0.3; }
  .input-action-wrapper button { padding: 1rem; font-size: 0.8rem; }

  .status-indicator {
    display: flex; align-items: center; justify-content: space-between;
    padding: 1rem; border: var(--border-thickness) solid var(--fg); font-size: 0.6rem;
  }
  .status-dot { width: 16px; height: 16px; border: var(--border-thickness) solid var(--fg); }

  @keyframes blinkRetro { 0%,49%{background:var(--fg)} 50%,100%{background:transparent} }
  @keyframes blinkWarn  { 0%,49%{background:var(--fg)} 50%,100%{background:transparent} }

  .status-indicator.connected .status-dot  { animation: blinkRetro 1s infinite; }
  .status-indicator.connecting .status-dot { animation: blinkWarn 0.6s infinite; }

  .log-terminal {
    height: 110px; margin-top: 1rem; border: var(--border-thickness) solid var(--fg);
    padding: 1rem; font-size: 0.55rem; line-height: 1.9; overflow-y: auto;
  }
  .log .entry { display: block; }
  .log .entry::before { content: '>'; margin-right: 8px; }

  /* DROP ZONE */
  .drop-zone {
    border: var(--border-thickness) dashed var(--fg);
    display: flex; flex-direction: column; align-items: center; justify-content: center;
    position: relative; cursor: pointer;
    min-height: 160px; padding: 1.5rem; text-align: center;
  }
  .drop-zone.disabled { opacity: 0.2; pointer-events: none; }
  .drop-zone.hover    { background: var(--fg); color: var(--bg); }
  .drop-zone.has-file { border-style: solid; }

  .dz-icon     { font-size: 1.5rem; white-space: pre; margin-bottom: 1rem; line-height: 1; }
  .dz-title    { font-size: 1rem; margin-bottom: 0.7rem; }
  .dz-subtitle { font-size: 0.55rem; line-height: 1.8; }

  /* Hidden file inputs */
  #fileInput   { position:absolute; inset:0; opacity:0; cursor:pointer; z-index:2; width:100%; }
  #folderInput { display:none; }

  /* FILE QUEUE */
  .queue-section { margin-top: 1.2rem; }
  .queue-header  {
    display: flex; justify-content: space-between; align-items: center;
    font-size: 0.6rem; border-bottom: 2px dashed var(--fg);
    padding-bottom: 0.6rem; margin-bottom: 0.8rem;
  }
  .queue-clear-btn { font-size: 0.5rem; padding: 0.4rem 0.7rem; box-shadow: 3px 3px 0 var(--fg); }

  .queue-list {
    max-height: 220px; overflow-y: auto;
    border: var(--border-thickness) solid var(--fg);
    display: none;
  }

  .queue-item {
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 0.5rem;
    padding: 0.7rem 0.8rem;
    font-size: 0.52rem;
    border-bottom: 2px dashed var(--fg);
  }
  .queue-item:last-child { border-bottom: none; }

  .qi-name {
    overflow: hidden; white-space: nowrap; text-overflow: ellipsis;
    line-height: 1.5;
  }
  .qi-path {
    font-size: 0.42rem; opacity: 0.5; overflow: hidden;
    white-space: nowrap; text-overflow: ellipsis;
  }
  .qi-size { font-size: 0.5rem; white-space: nowrap; opacity: 0.7; }

  .qi-status {
    font-size: 0.5rem; white-space: nowrap;
    padding: 0.2rem 0.4rem;
    border: 2px solid var(--fg);
  }
  .qi-status.pending  { opacity: 0.4; }
  .qi-status.sending  { animation: blinkRetro 0.5s infinite; }
  .qi-status.done     { }
  .qi-status.error    { }

  /* Global progress */
  .progress-container {
    border: var(--border-thickness) solid var(--fg);
    padding: 1.2rem; display: none; margin-top: 1rem;
  }
  .progress-header    { display: flex; justify-content: space-between; font-size: 0.55rem; margin-bottom: 1rem; gap: 0.5rem; }
  .progress-label-text { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; flex: 1; }
  .progress-track     { height: 24px; border: var(--border-thickness) solid var(--fg); padding: 2px; }
  .progress-fill {
    height: 100%; width: 0%;
    background-image: linear-gradient(to right, var(--fg) 80%, transparent 20%);
    background-size: 20px 100%;
    transition: width 0.1s steps(10, end);
  }

  /* INCOMING */
  .incoming-alert {
    border: var(--border-thickness) solid var(--fg);
    padding: 1.5rem; margin-bottom: 1.5rem; display: none;
    box-shadow: 8px 8px 0 var(--fg);
  }
  .alert-title  { font-size: 0.6rem; margin-bottom: 1.5rem; border-bottom: 2px dashed var(--fg); padding-bottom: 1rem; }
  .alert-file   { font-size: 0.85rem; word-break: break-all; margin-bottom: 0.5rem; line-height: 1.4; }
  .alert-meta   { font-size: 0.6rem; opacity: 0.7; margin-bottom: 0.4rem; }
  .alert-actions { display: flex; flex-direction: column; gap: 1rem; margin-top: 1.2rem; }
  .alert-actions button { padding: 1rem; font-size: 0.7rem; }

  /* CONTROLS */
  .transfer-controls { margin-top: 1.2rem; display: flex; gap: 1rem; }
  .folder-btn  { flex: 0 0 auto; padding: 0 1rem; height: 50px; font-size: 0.6rem; }
  button.send-btn { flex: 1; height: 50px; font-size: 0.9rem; }

  .queue-stats { font-size: 0.55rem; opacity: 0.6; margin-top: 0.6rem; }
</style>
</head>
<body>

<canvas id="bgCanvas"></canvas>

<header class="app-header">
  <div class="brand-text">
    <h1>AERO_FLY</h1>
    <p>Powered by CHRONEX SYSTEMS</p>
  </div>
  <button class="theme-toggle" id="themeToggle" onclick="toggleTheme()"><span id="themeIcon">*</span></button>
</header>

<main class="dashboard">

  <!-- LEFT: NODE -->
  <section class="panel">
    <div class="panel-header">[ NODE.DAT ]</div>

    <div class="id-display">
      <div class="id-display-label">YOUR_HOST_ID</div>
      <div class="id-value" id="myId">----</div>
      <button class="copy-btn" onclick="copyId()">[ COPY ID ]</button>
    </div>

    <div class="input-group">
      <label>TARGET_PEER_ID</label>
      <div class="input-action-wrapper">
        <input type="text" id="peerId" placeholder="0000-0000" maxlength="9" oninput="formatInput(this)" />
        <button id="connectBtn" onclick="connectToPeer()" disabled>LINK START &gt;</button>
      </div>
    </div>

    <div class="status-indicator idle" id="statusBox">
      <span id="statusText">NO SIGNAL</span>
      <div class="status-dot"></div>
    </div>

    <div class="log-terminal log" id="log"></div>
  </section>

  <!-- RIGHT: PAYLOAD -->
  <section class="panel">
    <div class="panel-header">[ PAYLOAD.EXE ]</div>

    <!-- INCOMING BANNER -->
    <div class="incoming-alert" id="incomingBanner">
      <div class="alert-title">!! INBOUND DATA REQUEST !!</div>
      <div class="alert-file" id="incomingName">UNKNOWN.FILE</div>
      <div class="alert-meta" id="incomingMeta"></div>
      <div class="alert-actions">
        <button onclick="acceptFile()">[ ACCEPT ]</button>
        <button onclick="declineFile()">[ DECLINE ]</button>
      </div>
    </div>

    <!-- DROP ZONE -->
    <div class="drop-zone disabled" id="dropZone"
         ondragover="onDragOver(event)"
         ondragleave="onDragLeave(event)"
         ondrop="onDrop(event)">
      <input type="file" id="fileInput" multiple onchange="onFileSelected(event)" />
      <div class="dz-icon"> [ _ ]
/___/|
|   ||
|___|/</div>
      <div class="dz-title">INSERT PAYLOAD</div>
      <div class="dz-subtitle">DRAG FILES OR FOLDER HERE<br>— OR — CLICK TO BROWSE MULTI-FILE<br>USE [+ FOLDER] BUTTON BELOW</div>
    </div>

    <!-- FOLDER INPUT (hidden) -->
    <input type="file" id="folderInput" webkitdirectory multiple onchange="onFolderSelected(event)" />

    <!-- CONTROLS -->
    <div class="transfer-controls">
      <button class="folder-btn" id="folderBtn" onclick="document.getElementById('folderInput').click()" disabled>+ FOLDER</button>
      <button class="send-btn" id="sendBtn" disabled onclick="startQueue()">EXECUTE TX &gt;&gt;</button>
    </div>

    <!-- QUEUE -->
    <div class="queue-section" id="queueSection" style="display:none">
      <div class="queue-header">
        <span id="queueTitle">QUEUE: 0 FILES</span>
        <button class="queue-clear-btn" onclick="clearQueue()">[ CLEAR ]</button>
      </div>
      <div class="queue-list" id="queueList"></div>
      <div class="queue-stats" id="queueStats"></div>
    </div>

    <!-- PROGRESS -->
    <div class="progress-container" id="progressWrap">
      <div class="progress-header">
        <span class="progress-label-text" id="progressLabel">LOADING...</span>
        <span id="progressPct">0%</span>
      </div>
      <div class="progress-track">
        <div class="progress-fill" id="progressFill"></div>
      </div>
    </div>

  </section>
</main>

<script>
  /* ====== CANVAS ====== */
  const canvas = document.getElementById('bgCanvas');
  const ctx    = canvas.getContext('2d');
  const PIXEL_SIZE = 32;
  let gridCols, gridRows, activePixels = [];

  function resizeCanvas() {
    canvas.width  = window.innerWidth;
    canvas.height = window.innerHeight;
    gridCols = Math.ceil(canvas.width  / PIXEL_SIZE);
    gridRows = Math.ceil(canvas.height / PIXEL_SIZE);
  }
  function initPixels() {
    activePixels = [];
    const count = Math.floor(gridCols * gridRows * 0.05);
    for (let i = 0; i < count; i++)
      activePixels.push({ x: Math.floor(Math.random()*gridCols), y: Math.floor(Math.random()*gridRows), life: Math.random()*50 });
  }
  function animateCanvas() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    const isLight = document.body.classList.contains('light-mode');
    ctx.fillStyle = isLight ? '#000' : '#fff';
    for (let p of activePixels) {
      if (--p.life <= 0) {
        p.x = Math.floor(Math.random()*gridCols);
        p.y = Math.floor(Math.random()*gridRows);
        p.life = Math.random()*50+10;
      }
      ctx.fillRect(p.x*PIXEL_SIZE, p.y*PIXEL_SIZE, PIXEL_SIZE-2, PIXEL_SIZE-2);
    }
    setTimeout(() => requestAnimationFrame(animateCanvas), 1000/15);
  }
  window.addEventListener('resize', () => { resizeCanvas(); initPixels(); });
  resizeCanvas(); initPixels(); animateCanvas();

  /* ====== THEME ====== */
  function toggleTheme() {
    const isLight = document.body.classList.toggle('light-mode');
    document.getElementById('themeIcon').textContent = isLight ? '#' : '*';
    localStorage.setItem('aero_theme', isLight ? 'light' : 'dark');
  }
  if (localStorage.getItem('aero_theme') === 'light') {
    document.body.classList.add('light-mode');
    document.getElementById('themeIcon').textContent = '#';
  }

  /* ====== TRANSFER CORE ====== */
  const CHUNK_SIZE         = 256 * 1024;
  const MAX_BUFFERED_AMOUNT = 2 * 1024 * 1024;

  let peer, conn;

  // Queue: array of { file, relativePath, status, id }
  let fileQueue   = [];
  let queueIndex  = 0;   // which file we're currently sending
  let isSending   = false;

  // Receiving state
  let incomingQueue  = [];   // queued incoming metas waiting to be received
  let rxMeta         = null;
  let rxChunks       = [];
  let rxBytes        = 0;
  let rxBatchTotal   = 0;
  let rxBatchCount   = 0;
  let rxBatchReceived = 0;

  /* ---- LOG ---- */
  function log(msg, type = '') {
    const el  = document.getElementById('log');
    const entry = document.createElement('span');
    entry.className = 'entry ' + type;
    const ts = new Date().toLocaleTimeString([], {hour:'2-digit',minute:'2-digit',second:'2-digit'});
    entry.textContent = `[${ts}] ${msg}`;
    el.appendChild(entry);
    el.appendChild(document.createElement('br'));
    el.scrollTop = el.scrollHeight;
  }

  /* ---- STATUS ---- */
  function setStatus(text, type) {
    const box = document.getElementById('statusBox');
    box.className = 'status-indicator ' + type;
    document.getElementById('statusText').textContent = text;
  }

  /* ---- PEER UTILS ---- */
  function generateId() {
    const n = () => Math.floor(1000 + Math.random()*9000);
    return `${n()}-${n()}`;
  }
  function formatId(raw) {
    const d = raw.replace(/\D/g,'').slice(0,8);
    return d.length > 4 ? d.slice(0,4)+'-'+d.slice(4) : d;
  }
  function formatInput(el) {
    el.value = formatId(el.value);
    document.getElementById('connectBtn').disabled = el.value.replace('-','').length < 8;
  }
  function copyId() {
    navigator.clipboard.writeText(document.getElementById('myId').textContent)
      .then(() => log('Room ID copied.', 'info'));
  }

  /* ---- INIT PEER ---- */
  function initPeer() {
    const id = generateId();
    document.getElementById('myId').textContent = id;

    peer = new Peer(id, {
      config: { iceServers: [
        { urls: 'stun:stun.l.google.com:19302' },
        { urls: 'stun:stun1.l.google.com:19302' }
      ]}
    });

    peer.on('open', () => {
      log('Ready. ID: ' + id, 'ok');
      document.getElementById('connectBtn').disabled = false;
    });

    peer.on('connection', c => {
      conn = c;
      setupConn();
      log('Incoming peer connection.', 'info');
    });

    peer.on('error', err => {
      log('Error: ' + err.message, 'err');
      setStatus('SYS HALT', 'error');
    });
  }

  function connectToPeer() {
    const peerId = document.getElementById('peerId').value.replace(/\s/g,'');
    if (!peerId) return;
    setStatus('SYNCING...', 'connecting');
    log('Connecting to ' + peerId + '…');
    conn = peer.connect(peerId, { reliable: true });
    setupConn();
  }

  function setupConn() {
    conn.on('open', () => {
      setStatus('LINK ACTIVE', 'connected');
      log('Link established ✓', 'ok');
      enableDropZone();
    });

    conn.on('data', handleData);

    conn.on('close', () => {
      setStatus('NO SIGNAL', 'idle');
      log('Connection closed.', 'err');
      document.getElementById('dropZone').classList.add('disabled');
      document.getElementById('folderBtn').disabled = true;
      document.getElementById('sendBtn').disabled = true;
    });

    conn.on('error', err => log('Conn error: ' + err.message, 'err'));
  }

  function enableDropZone() {
    document.getElementById('dropZone').classList.remove('disabled');
    document.getElementById('folderBtn').disabled = false;
  }

  /* ====== RECEIVE SIDE ====== */
  function handleData(data) {
    if (data.type === 'batch_start') {
      // Sender announcing how many files are coming
      rxBatchTotal    = data.count;
      rxBatchReceived = 0;
      log(`Inbound batch: ${data.count} file(s), ${fmtSize(data.totalSize)}`, 'info');
      // Show incoming banner for the whole batch
      document.getElementById('incomingName').textContent = `${data.count} FILE(S)`;
      document.getElementById('incomingMeta').textContent =
        `TOTAL: ${fmtSize(data.totalSize)}  //  ${data.count} ITEM(S)`;
      document.getElementById('incomingBanner').style.display = 'block';

    } else if (data.type === 'meta') {
      // Individual file meta — push to queue, process if first
      incomingQueue.push(data);
      if (incomingQueue.length === 1) receiveNextFile();

    } else if (data.type === 'chunk') {
      rxChunks.push(data.chunk);
      rxBytes += data.chunk.byteLength;
      const pct = Math.round((rxBytes / rxMeta.size) * 100);
      const overall = rxBatchTotal > 1
        ? ` [${rxBatchReceived+1}/${rxBatchTotal}]`
        : '';
      showProgress(pct, `RX${overall}: ${rxMeta.name}  ${pct}%`);

    } else if (data.type === 'file_done') {
      // Save file
      const blob = new Blob(rxChunks, { type: rxMeta.mime });
      downloadBlob(blob, rxMeta.name);
      log(`Received: ${rxMeta.relativePath || rxMeta.name} (${fmtSize(rxMeta.size)})`, 'ok');
      rxBatchReceived++;
      incomingQueue.shift();
      rxMeta = null; rxChunks = []; rxBytes = 0;
      if (incomingQueue.length > 0) receiveNextFile();
      else { hideProgress(); log('All files received ✓', 'ok'); }

    } else if (data.type === 'decline') {
      log('Transfer declined by peer.', 'err');
      hideProgress();

    } else if (data.type === 'accept') {
      log('Peer accepted — transmitting…', 'info');
      sendNextInQueue();
    }
  }

  function receiveNextFile() {
    rxMeta   = incomingQueue[0];
    rxChunks = [];
    rxBytes  = 0;
    showProgress(0, `RX [${rxBatchReceived+1}/${rxBatchTotal}]: ${rxMeta.name}`);
  }

  function downloadBlob(blob, filename) {
    const url = URL.createObjectURL(blob);
    const a   = document.createElement('a');
    a.href = url; a.download = filename; a.click();
    URL.revokeObjectURL(url);
  }

  /* ---- Accept / Decline ---- */
  function acceptFile() {
    document.getElementById('incomingBanner').style.display = 'none';
    conn.send({ type: 'accept' });
    showProgress(0, 'Awaiting data stream…');
    log('Accepted batch.', 'info');
  }

  function declineFile() {
    document.getElementById('incomingBanner').style.display = 'none';
    conn.send({ type: 'decline' });
    log('Declined.', 'err');
  }

  /* ====== SEND SIDE ====== */

  /* ---- Queue management ---- */
  function addFilesToQueue(fileList, basePath) {
    for (const file of fileList) {
      const relPath = file.webkitRelativePath || file.name;
      const id      = Date.now() + '_' + Math.random().toString(36).slice(2);
      fileQueue.push({ file, relativePath: relPath, status: 'pending', id });
    }
    renderQueue();
  }

  function clearQueue() {
    if (isSending) return;
    fileQueue = []; queueIndex = 0;
    renderQueue();
    document.getElementById('sendBtn').disabled = true;
  }

  function renderQueue() {
    const section = document.getElementById('queueSection');
    const listEl  = document.getElementById('queueList');
    const titleEl = document.getElementById('queueTitle');
    const statsEl = document.getElementById('queueStats');

    if (fileQueue.length === 0) {
      section.style.display = 'none';
      listEl.style.display  = 'none';
      return;
    }

    section.style.display = 'block';
    listEl.style.display  = 'block';

    const totalSize = fileQueue.reduce((a, q) => a + q.file.size, 0);
    titleEl.textContent = `QUEUE: ${fileQueue.length} FILE(S)`;
    statsEl.textContent = `TOTAL SIZE: ${fmtSize(totalSize)}`;

    listEl.innerHTML = '';
    for (const item of fileQueue) {
      const row = document.createElement('div');
      row.className = 'queue-item';
      row.id = 'qi_' + item.id;

      // Name + path column
      const nameCol = document.createElement('div');
      const nameLine = document.createElement('div');
      nameLine.className = 'qi-name';
      nameLine.textContent = item.file.name;
      nameCol.appendChild(nameLine);
      if (item.relativePath !== item.file.name) {
        const pathLine = document.createElement('div');
        pathLine.className = 'qi-path';
        pathLine.textContent = item.relativePath;
        nameCol.appendChild(pathLine);
      }

      const sizeEl = document.createElement('div');
      sizeEl.className = 'qi-size';
      sizeEl.textContent = fmtSize(item.file.size);

      const statusEl = document.createElement('div');
      statusEl.className = 'qi-status ' + item.status;
      statusEl.id = 'qs_' + item.id;
      statusEl.textContent = item.status === 'pending' ? 'WAIT'
                           : item.status === 'sending' ? 'TX..'
                           : item.status === 'done'    ? 'DONE'
                           : 'ERR';

      row.appendChild(nameCol);
      row.appendChild(sizeEl);
      row.appendChild(statusEl);
      listEl.appendChild(row);
    }

    if (conn) document.getElementById('sendBtn').disabled = false;
  }

  function updateQueueItemStatus(id, status) {
    const el = document.getElementById('qs_' + id);
    if (!el) return;
    el.className = 'qi-status ' + status;
    el.textContent = status === 'pending' ? 'WAIT'
                   : status === 'sending' ? 'TX..'
                   : status === 'done'    ? 'DONE'
                   : 'ERR';
  }

  /* ---- Start queue ---- */
  function startQueue() {
    if (!conn || fileQueue.length === 0 || isSending) return;
    isSending  = true;
    queueIndex = 0;
    document.getElementById('sendBtn').disabled = true;

    const totalSize = fileQueue.reduce((a, q) => a + q.file.size, 0);

    // Announce batch to receiver
    conn.send({ type: 'batch_start', count: fileQueue.length, totalSize });
    log(`Offering batch: ${fileQueue.length} file(s), ${fmtSize(totalSize)}`, 'info');
    showProgress(0, 'Waiting for peer to accept…');
  }

  // Called after peer sends 'accept'
  async function sendNextInQueue() {
    if (queueIndex >= fileQueue.length) {
      // All done
      isSending = false;
      log('All files sent ✓', 'ok');
      hideProgress();
      return;
    }

    const item = fileQueue[queueIndex];
    item.status = 'sending';
    updateQueueItemStatus(item.id, 'sending');

    // Send individual file meta
    conn.send({
      type: 'meta',
      name: item.file.name,
      relativePath: item.relativePath,
      size: item.file.size,
      mime: item.file.type
    });

    // Send chunks
    try {
      await sendChunks(item.file, queueIndex);
      conn.send({ type: 'file_done' });
      item.status = 'done';
      updateQueueItemStatus(item.id, 'done');
      log(`Sent [${queueIndex+1}/${fileQueue.length}]: ${item.relativePath}`, 'ok');
    } catch(e) {
      item.status = 'error';
      updateQueueItemStatus(item.id, 'error');
      log(`Error sending ${item.file.name}: ` + e.message, 'err');
    }

    queueIndex++;
    sendNextInQueue();   // process next file immediately
  }

  async function sendChunks(file, idx) {
    let offset = 0;

    function readChunk(off) {
      return new Promise((resolve, reject) => {
        const reader = new FileReader();
        reader.onload  = e => resolve(e.target.result);
        reader.onerror = reject;
        reader.readAsArrayBuffer(file.slice(off, off + CHUNK_SIZE));
      });
    }

    function waitForDrain() {
      return new Promise(resolve => {
        const dc = conn.dataChannel;
        if (!dc || dc.bufferedAmount <= MAX_BUFFERED_AMOUNT) { resolve(); return; }
        const check = () => {
          if (dc.bufferedAmount <= MAX_BUFFERED_AMOUNT) resolve();
          else setTimeout(check, 50);
        };
        setTimeout(check, 50);
      });
    }

    while (offset < file.size) {
      await waitForDrain();
      const chunk = await readChunk(offset);
      conn.send({ type: 'chunk', chunk });
      offset += chunk.byteLength;
      const pct = Math.round((offset / file.size) * 100);
      showProgress(pct, `TX [${idx+1}/${fileQueue.length}]: ${file.name}  ${pct}%`);
    }
  }

  /* ====== FILE / FOLDER SELECTION ====== */
  function onDragOver(e) {
    e.preventDefault();
    document.getElementById('dropZone').classList.add('hover');
  }
  function onDragLeave() {
    document.getElementById('dropZone').classList.remove('hover');
  }
  async function onDrop(e) {
    e.preventDefault();
    document.getElementById('dropZone').classList.remove('hover');

    // Use DataTransferItemList to support folders
    const items = e.dataTransfer.items;
    if (!items) return;

    const files = [];
    const promises = [];

    for (const item of items) {
      if (item.kind !== 'file') continue;
      const entry = item.webkitGetAsEntry ? item.webkitGetAsEntry() : null;
      if (entry && entry.isDirectory) {
        promises.push(readDirectory(entry, entry.name, files));
      } else {
        const file = item.getAsFile();
        if (file) { file._relativePath = file.name; files.push(file); }
      }
    }

    await Promise.all(promises);
    if (files.length > 0) {
      addFilesToQueueRaw(files);
      log(`Staged ${files.length} file(s) via drop.`);
    }
  }

  function readDirectory(dirEntry, basePath, fileArr) {
    return new Promise(resolve => {
      const reader = dirEntry.createReader();
      let allEntries = [];

      function readBatch() {
        reader.readEntries(async entries => {
          if (entries.length === 0) {
            // Process collected entries
            const subPromises = allEntries.map(entry => {
              if (entry.isFile) {
                return new Promise(r => {
                  entry.file(f => {
                    f._relativePath = basePath + '/' + f.name;
                    fileArr.push(f);
                    r();
                  });
                });
              } else if (entry.isDirectory) {
                return readDirectory(entry, basePath + '/' + entry.name, fileArr);
              }
            });
            await Promise.all(subPromises);
            resolve();
          } else {
            allEntries = allEntries.concat(Array.from(entries));
            readBatch(); // Chrome batches at 100, keep reading
          }
        });
      }

      readBatch();
    });
  }

  function addFilesToQueueRaw(files) {
    for (const file of files) {
      const relPath = file._relativePath || file.webkitRelativePath || file.name;
      const id = Date.now() + '_' + Math.random().toString(36).slice(2);
      fileQueue.push({ file, relativePath: relPath, status: 'pending', id });
    }
    renderQueue();
  }

  function onFileSelected(e) {
    const files = Array.from(e.target.files);
    if (files.length) {
      addFilesToQueue(files);
      log(`Staged ${files.length} file(s).`);
    }
    e.target.value = '';
  }

  function onFolderSelected(e) {
    const files = Array.from(e.target.files);
    if (files.length) {
      addFilesToQueue(files);
      log(`Staged folder: ${files.length} file(s).`);
    }
    e.target.value = '';
  }

  /* ====== PROGRESS ====== */
  function showProgress(pct, label) {
    document.getElementById('progressWrap').style.display = 'block';
    document.getElementById('progressLabel').textContent  = label;
    document.getElementById('progressPct').textContent    = pct + '%';
    document.getElementById('progressFill').style.width   = pct + '%';
  }
  function hideProgress() {
    document.getElementById('progressFill').style.width = '100%';
    setTimeout(() => {
      document.getElementById('progressWrap').style.display = 'none';
      document.getElementById('progressFill').style.width   = '0%';
    }, 800);
  }

  /* ====== UTILS ====== */
  function fmtSize(bytes) {
    if (bytes < 1024)            return bytes + ' B';
    if (bytes < 1024*1024)       return (bytes/1024).toFixed(1) + ' KB';
    if (bytes < 1024*1024*1024)  return (bytes/1024/1024).toFixed(1) + ' MB';
    return (bytes/1024/1024/1024).toFixed(2) + ' GB';
  }

  initPeer();
</script>
</body>
</html>
